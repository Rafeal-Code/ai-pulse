<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe4">
  <meta name="description" content="AI Pulse：像翻书一样浏览每日 AI 资讯。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <title>AI Pulse · AI 脉冲</title>
  <style>
  :root{
    --paper:#f4efe4; --note-bg:#efe8d7; --ink:#2b261c; --ink-soft:#5c5545;
    --ink-faint:#8d8371; --rule:#d8cfba; --rule-strong:#2b261c; --seal:#963a28;
    --serif:"Georgia","Times New Roman","Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:repeating-linear-gradient(0deg,rgba(120,100,60,.025) 0 1px,transparent 1px 4px)}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  .page{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:0 22px}

  /* ── 报头 ── */
  .mast{padding-top:calc(env(safe-area-inset-top) + 16px)}
  .mast-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-faint);letter-spacing:.08em}
  .mast-top .nav{display:flex;gap:16px}
  .nav-link{color:var(--ink-soft);border-bottom:1px solid transparent;padding-bottom:2px;letter-spacing:.12em}
  .nav-link.active{color:var(--seal);border-bottom-color:var(--seal)}
  .mast-title{text-align:center;font-size:36px;font-weight:700;letter-spacing:.35em;text-indent:.35em;margin:16px 0 3px}
  .mast-sub{text-align:center;font-size:11px;letter-spacing:.34em;text-indent:.34em;color:var(--ink-faint);margin:0 0 14px;text-transform:uppercase}
  .rule{border:0;border-top:2px solid var(--rule-strong);margin:0}
  .rule.thin{border-top-width:1px;margin-top:3px}

  /* ── 分类 ── */
  .chips{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center;padding:11px 0;border-bottom:1px solid var(--rule);font-size:13px}
  .chip{color:var(--ink-soft);letter-spacing:.05em}
  .chip.active{color:var(--seal);font-weight:700}

  /* ── 快讯列表 ── */
  .entry{display:flex;gap:14px;padding:17px 2px;border-bottom:1px dotted var(--rule);cursor:pointer}
  .entry:active{background:var(--note-bg)}
  .entry-no{font-size:13px;color:var(--ink-faint);min-width:2.1em;padding-top:3px;font-variant-numeric:oldstyle-nums}
  .entry-main{flex:1;min-width:0}
  .entry-title{margin:0 0 5px;font-size:17px;line-height:1.5;font-weight:700}
  .entry.read .entry-title{color:var(--ink-faint);font-weight:500}
  .entry-snippet{margin:0 0 7px;font-size:13px;line-height:1.75;color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .entry-meta{font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em;display:flex;align-items:center;gap:7px}
  .entry-meta .cat{color:var(--seal)}
  .fav{margin-left:auto;font-size:16px;color:var(--ink-faint);padding:0 4px;line-height:1}
  .fav.saved{color:var(--seal)}
  .empty{padding:64px 20px;text-align:center;color:var(--ink-faint);font-size:14px;line-height:2.1}

  /* ── 提示与页脚 ── */
  .note{border:1px solid var(--rule);border-left:3px solid var(--seal);background:var(--note-bg);
    padding:10px 14px;font-size:12.5px;line-height:1.9;color:var(--ink-soft);margin:14px 0 2px}
  .colophon{padding:24px 0 calc(env(safe-area-inset-bottom) + 34px);text-align:center;font-size:11.5px;color:var(--ink-faint);letter-spacing:.08em;line-height:2}

  /* ── 阅读页 ── */
  .reader{position:fixed;inset:0;background:var(--paper);z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .reader[hidden]{display:none}
  .reader:before{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(120,100,60,.025) 0 1px,transparent 1px 4px)}
  .reader-inner{position:relative;max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 22px calc(env(safe-area-inset-bottom) + 44px)}
  .back{font-size:13px;color:var(--seal);letter-spacing:.14em;margin-bottom:22px}
  .reader-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .kicker{font-size:11.5px;letter-spacing:.16em;color:var(--ink-faint);text-transform:uppercase}
  .reader .fav{font-size:20px}
  .reader h2{font-size:27px;line-height:1.5;margin:10px 0 16px;font-weight:700}
  .reader-rule{border:0;border-top:1px solid var(--rule-strong);margin:0 0 18px;opacity:.55}
  .reader .body p{font-size:15.5px;line-height:2.05;margin:0 0 15px;text-align:justify;color:var(--ink)}
  .reader h3.sec{font-size:13px;letter-spacing:.22em;color:var(--seal);margin:22px 0 8px;font-weight:700}
  .reader .fine{font-size:12px;color:var(--ink-faint);line-height:1.9}
  .src-btn{display:inline-block;margin:20px 0 4px;padding:10px 20px;border:1px solid var(--rule-strong);
    color:var(--ink);text-decoration:none;font-size:13.5px;letter-spacing:.1em}
  .src-btn:active{background:var(--note-bg)}
  .pager{display:flex;justify-content:space-between;gap:18px;border-top:1px solid var(--rule);margin-top:30px;padding-top:16px}
  .pager button{font-size:13px;color:var(--ink-soft);line-height:1.6;max-width:46%}
  .pager button:disabled{color:var(--rule);cursor:default}
  .pager .next{text-align:right;margin-left:auto}
  .pager .dir{display:block;font-size:11px;color:var(--ink-faint);letter-spacing:.18em;margin-bottom:3px}

  /* ── 偏好 ── */
  .settings{padding:18px 0 10px}
  .settings h3{font-size:14px;letter-spacing:.2em;color:var(--ink);margin:20px 0 6px}
  .toggle-row{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px dotted var(--rule);font-size:14.5px}
  .toggle-row input{accent-color:var(--seal);width:18px;height:18px}
  .settings p{font-size:12.5px;color:var(--ink-faint);line-height:1.95;margin:10px 0}
  .reload-btn{margin-top:14px;padding:9px 18px;border:1px solid var(--rule-strong);font-size:13px;letter-spacing:.1em}

  @media (max-width:420px){.mast-title{font-size:30px}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header class="mast">
      <div class="mast-top">
        <span id="mast-date"></span>
        <nav class="nav" aria-label="版块">
          <button class="nav-link active" data-tab="feed">快讯</button>
          <button class="nav-link" data-tab="saved">收藏</button>
          <button class="nav-link" data-tab="prefs">偏好</button>
          <button class="nav-link" id="refresh" aria-label="刷新">↻</button>
        </nav>
      </div>
      <h1 class="mast-title">AI 脉冲</h1>
      <p class="mast-sub">AI Pulse · 每日文摘</p>
      <hr class="rule"><hr class="rule thin">
    </header>
    <div id="banner" hidden></div>
    <nav id="chips" class="chips" aria-label="分类筛选"></nav>
    <main id="list"></main>
    <footer class="colophon" id="colophon"></footer>
  </div>

  <div id="reader" class="reader" hidden>
    <div class="reader-inner">
      <button class="back" id="back">← 返回目录</button>
      <div id="reader-body"></div>
    </div>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
